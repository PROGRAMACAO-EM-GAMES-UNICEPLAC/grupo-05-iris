<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJETO ÍRIS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --void:#05070a;
    --steel:#0d1218;
    --iris-red:#ff2b3d;
    --iris-cyan:#3ee6d8;
    --bone:#e9ecef;
    --dim:#5a6470;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:var(--void);
    font-family:'Chakra Petch',sans-serif;
    color:var(--bone);
  }
  #app{position:fixed;inset:0;}

  /* ---------- INTRO ---------- */
  #intro{
    position:absolute;inset:0;z-index:50;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(62,230,216,0.06), transparent 60%),
      var(--void);
    text-align:center;padding:32px;
  }
  #intro h1{
    font-size:clamp(38px,8vw,84px);
    font-weight:700;
    letter-spacing:2px;
    color:var(--bone);
    text-shadow:0 0 24px rgba(255,43,61,0.35);
  }
  #intro h1 span{color:var(--iris-cyan);}
  #lore{
    max-width:560px;margin-top:22px;
    font-family:'JetBrains Mono',monospace;
    font-size:14px;line-height:1.9;
    color:var(--dim);
    min-height:130px;
    border-left:2px solid var(--iris-red);
    padding-left:18px;text-align:left;
  }
  #lore .cursor{color:var(--iris-cyan);animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  #startBtn{
    margin-top:36px;
    background:transparent;
    border:1.5px solid var(--iris-cyan);
    color:var(--iris-cyan);
    font-family:'Chakra Petch',sans-serif;
    font-size:15px;font-weight:600;letter-spacing:3px;
    padding:14px 38px;cursor:pointer;
    transition:background .2s, color .2s;
    opacity:0;pointer-events:none;
  }
  #startBtn.ready{opacity:1;pointer-events:auto;}
  #startBtn:hover{background:var(--iris-cyan);color:var(--void);}
  #introNote{margin-top:14px;font-size:12px;color:var(--dim);font-family:'JetBrains Mono',monospace;opacity:0;transition:opacity .3s;}
  #introNote.ready{opacity:1;}

  /* ---------- LOADING ---------- */
  #loading{
    position:absolute;inset:0;z-index:45;
    display:none;align-items:center;justify-content:center;flex-direction:column;
    background:var(--void);
  }
  #loading.show{display:flex;}
  #loading .ring{
    width:52px;height:52px;border-radius:50%;
    border:2px solid rgba(62,230,216,0.2);border-top-color:var(--iris-cyan);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  #loading p{margin-top:18px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--dim);letter-spacing:1px;}

  /* ---------- GAME ---------- */
  #gameWrap{position:absolute;inset:0;display:none;}
  #gameWrap.show{display:block;}
  #three-canvas{position:absolute;inset:0;display:block;}
  #video{position:absolute;bottom:14px;right:14px;width:150px;height:112px;border:1px solid rgba(62,230,216,0.4);
    transform:scaleX(-1);opacity:0.85;z-index:10;object-fit:cover;background:#000;}

  #hud{position:absolute;inset:0;z-index:20;pointer-events:none;}
  #hudTop{
    position:absolute;top:22px;left:0;right:0;
    display:flex;justify-content:space-between;align-items:flex-start;padding:0 28px;
  }
  #frag{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--dim);letter-spacing:1px;}
  #frag b{color:var(--iris-cyan);font-size:16px;}
  #title-small{font-family:'Chakra Petch',sans-serif;font-weight:700;letter-spacing:4px;font-size:13px;color:var(--dim);}
  #title-small span{color:var(--iris-red);}

  #enigma{
    position:absolute;top:70px;left:50%;transform:translateX(-50%);
    font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:6px;
    color:var(--iris-cyan);text-shadow:0 0 12px rgba(62,230,216,0.5);
    white-space:nowrap;
  }
  #enigma .slot{color:var(--dim);}

  #crosshair{
    position:absolute;width:26px;height:26px;left:0;top:0;
    transform:translate(-50%,-50%);
    pointer-events:none;z-index:22;
    transition:transform .04s linear;
  }
  #crosshair svg{width:100%;height:100%;}
  #crosshair.fire circle{stroke:var(--iris-red) !important;}

  #handStatus{
    position:absolute;bottom:22px;left:22px;
    font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim);
    display:flex;align-items:center;gap:8px;
  }
  #handDot{width:8px;height:8px;border-radius:50%;background:#5a2028;transition:background .15s;}
  #handDot.active{background:var(--iris-red);box-shadow:0 0 8px var(--iris-red);}

  #vignette{position:absolute;inset:0;pointer-events:none;z-index:15;
    box-shadow:inset 0 0 180px 40px rgba(0,0,0,0.75);}

  /* ---------- END ---------- */
  #ending{
    position:absolute;inset:0;z-index:60;display:none;
    align-items:center;justify-content:center;flex-direction:column;
    background:var(--void);text-align:center;padding:32px;
  }
  #ending.show{display:flex;}
  #ending .phrase{
    font-family:'JetBrains Mono',monospace;font-size:clamp(16px,3vw,22px);
    letter-spacing:8px;color:var(--iris-cyan);margin-bottom:26px;
    text-shadow:0 0 18px rgba(62,230,216,0.5);
  }
  #ending h2{font-size:clamp(30px,6vw,58px);letter-spacing:3px;font-weight:700;}
  #ending h2 span{color:var(--iris-red);}
  #ending p{margin-top:16px;color:var(--dim);font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:2px;}
</style>
</head>
<body>
<div id="app">

  <!-- INTRO -->
  <div id="intro">
    <h1>PROJETO <span>ÍRIS</span></h1>
    <div id="lore"></div>
    <button id="startBtn">INICIAR PROTOCOLO</button>
    <div id="introNote">requer acesso à câmera — mire com o dedo indicador, feche a pinça para disparar</div>
  </div>

  <!-- LOADING -->
  <div id="loading">
    <div class="ring"></div>
    <p>CALIBRANDO RASTREAMENTO NEURAL...</p>
  </div>

  <!-- GAME -->
  <div id="gameWrap">
    <canvas id="three-canvas"></canvas>
    <video id="video" autoplay playsinline muted></video>
    <div id="vignette"></div>
    <div id="hud">
      <div id="hudTop">
        <div id="title-small">PROJETO <span>ÍRIS</span> · SIMULAÇÃO 04</div>
        <div id="frag">FRAGMENTOS <b id="fragCount">0/5</b></div>
      </div>
      <div id="enigma"></div>
      <div id="handStatus"><div id="handDot"></div><span id="handLabel">SEM RASTREAMENTO</span></div>
    </div>
    <div id="crosshair">
      <svg viewBox="0 0 26 26">
        <circle cx="13" cy="13" r="9" fill="none" stroke="#3ee6d8" stroke-width="1.4"/>
        <line x1="13" y1="0" x2="13" y2="6" stroke="#3ee6d8" stroke-width="1.4"/>
        <line x1="13" y1="20" x2="13" y2="26" stroke="#3ee6d8" stroke-width="1.4"/>
        <line x1="0" y1="13" x2="6" y2="13" stroke="#3ee6d8" stroke-width="1.4"/>
        <line x1="20" y1="13" x2="26" y2="13" stroke="#3ee6d8" stroke-width="1.4"/>
      </svg>
    </div>
  </div>

  <!-- ENDING -->
  <div id="ending">
    <div class="phrase" id="revealedPhrase"></div>
    <h2>A MEMÓRIA <span>NÃO</span> É SUA</h2>
    <p>PROJETO ÍRIS · CONTINUA...</p>
  </div>

</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
/* ============================================================
   LORE — typewriter intro
   ============================================================ */
const loreLines = [
  "SIMULAÇÃO 04 — SUJEITO: DESCONHECIDO",
  "O sistema ÍRIS lê o gesto antes da intenção.",
  "Cada fragmento recuperado é uma memória que não é sua.",
  "Aponte. Feche a mão. Descubra quem te colocou aqui."
];
const loreEl = document.getElementById('lore');
const startBtn = document.getElementById('startBtn');
const introNote = document.getElementById('introNote');

async function typewriter(){
  for(const line of loreLines){
    let cur = "";
    loreEl.innerHTML = "";
    for(const ch of line){
      cur += ch;
      loreEl.innerHTML = cur + '<span class="cursor">▌</span>';
      await new Promise(r=>setTimeout(r, 18));
    }
    await new Promise(r=>setTimeout(r, 650));
  }
  loreEl.innerHTML = loreLines[loreLines.length-1];
  startBtn.classList.add('ready');
  introNote.classList.add('ready');
}
typewriter();

/* ============================================================
   STATE
   ============================================================ */
const ENIGMA_TARGET = "ÍRIS VÊ"; // revealed letter by letter as fragments are hit (padded to 5 slots)
const FRAGMENT_COUNT = 5;
let fragmentsHit = 0;
let gameActive = false;
let lastShotTime = 0;
const SHOOT_COOLDOWN = 550; // ms between shots

/* ============================================================
   THREE.JS SCENE
   ============================================================ */
let scene, camera, renderer, raycaster;
let targets = [];
let corridorSegments = [];
const CORRIDOR_LENGTH = 40;

function initThree(){
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x05070a, 0.045);

  camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0, 1.6, 6);

  renderer = new THREE.WebGLRenderer({canvas: document.getElementById('three-canvas'), antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  // lighting
  const ambient = new THREE.AmbientLight(0x1a2230, 1.2);
  scene.add(ambient);
  const redLight = new THREE.PointLight(0xff2b3d, 2.2, 18);
  redLight.position.set(-3, 3, -2);
  scene.add(redLight);
  const cyanLight = new THREE.PointLight(0x3ee6d8, 2.0, 18);
  cyanLight.position.set(3, 2, -10);
  scene.add(cyanLight);

  // corridor: floor + wall strips receding into fog
  const floorMat = new THREE.MeshStandardMaterial({color:0x0d1218, roughness:0.9});
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(14, CORRIDOR_LENGTH*2), floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.position.set(0, 0, -CORRIDOR_LENGTH/2);
  scene.add(floor);

  const stripMat = new THREE.MeshStandardMaterial({color:0x111820, roughness:0.6, metalness:0.3});
  const edgeMatL = new THREE.MeshStandardMaterial({color:0xff2b3d, emissive:0xff2b3d, emissiveIntensity:0.6});
  const edgeMatR = new THREE.MeshStandardMaterial({color:0x3ee6d8, emissive:0x3ee6d8, emissiveIntensity:0.6});

  for(let i=0;i<16;i++){
    const z = -i*3;
    const wallL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 4, 2.6), stripMat);
    wallL.position.set(-6.5, 2, z);
    scene.add(wallL);
    const wallR = wallL.clone();
    wallR.position.x = 6.5;
    scene.add(wallR);

    const stripeL = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 2.6), edgeMatL);
    stripeL.position.set(-6.3, 0.05, z);
    scene.add(stripeL);
    const stripeR = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 2.6), edgeMatR);
    stripeR.position.set(6.3, 0.05, z);
    scene.add(stripeR);
  }

  raycaster = new THREE.Raycaster();
  spawnAllTargets();
  window.addEventListener('resize', onResize);
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function makeTarget(x,y,z){
  const geo = new THREE.IcosahedronGeometry(0.42, 0);
  const mat = new THREE.MeshStandardMaterial({color:0xff2b3d, emissive:0xff2b3d, emissiveIntensity:0.9, roughness:0.3});
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x,y,z);
  mesh.userData.alive = true;
  mesh.userData.spin = 0.4 + Math.random()*0.6;
  scene.add(mesh);
  return mesh;
}

function spawnAllTargets(){
  targets.forEach(t=>scene.remove(t));
  targets = [];
  for(let i=0;i<FRAGMENT_COUNT;i++){
    const x = (Math.random()-0.5)*8;
    const y = 1.0 + Math.random()*2.0;
    const z = -6 - i*6 - Math.random()*3;
    targets.push(makeTarget(x,y,z));
  }
}

function respawnTarget(mesh){
  mesh.position.set((Math.random()-0.5)*8, 1.0+Math.random()*2.0, -8 - Math.random()*24);
  mesh.userData.alive = true;
  mesh.material.emissiveIntensity = 0.9;
  mesh.scale.set(1,1,1);
}

/* ============================================================
   ENIGMA HUD
   ============================================================ */
const enigmaEl = document.getElementById('enigma');
function renderEnigma(){
  const revealed = ENIGMA_TARGET.split('').slice(0, Math.ceil(fragmentsHit * ENIGMA_TARGET.length / FRAGMENT_COUNT));
  let out = "";
  for(let i=0;i<ENIGMA_TARGET.length;i++){
    const ch = ENIGMA_TARGET[i];
    if(ch === ' '){ out += "  "; continue; }
    out += (i < revealed.length) ? ch : '<span class="slot">░</span>';
  }
  enigmaEl.innerHTML = out;
}
renderEnigma();

/* ============================================================
   HAND TRACKING (MediaPipe)
   ============================================================ */
const videoEl = document.getElementById('video');
const crosshairEl = document.getElementById('crosshair');
const handDot = document.getElementById('handDot');
const handLabel = document.getElementById('handLabel');

let aimX = 0.5, aimY = 0.5; // normalized 0-1, smoothed
let targetAimX = 0.5, targetAimY = 0.5;
let pinchActive = false;

function onHandResults(results){
  if(results.multiHandLandmarks && results.multiHandLandmarks.length > 0){
    const lm = results.multiHandLandmarks[0];
    const indexTip = lm[8];
    const thumbTip = lm[4];

    // mirror X because video is mirrored visually
    targetAimX = 1 - indexTip.x;
    targetAimY = indexTip.y;

    const dx = indexTip.x - thumbTip.x;
    const dy = indexTip.y - thumbTip.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    handDot.classList.add('active');
    handLabel.textContent = "MÃO DETECTADA";

    const now = performance.now();
    if(dist < 0.06){
      if(!pinchActive && now - lastShotTime > SHOOT_COOLDOWN){
        pinchActive = true;
        lastShotTime = now;
        fireShot();
      }
    } else {
      pinchActive = false;
    }
  } else {
    handDot.classList.remove('active');
    handLabel.textContent = "SEM RASTREAMENTO";
  }
}

let handsInstance, cameraUtil;
async function initHandTracking(){
  handsInstance = new Hands({locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
  handsInstance.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.6
  });
  handsInstance.onResults(onHandResults);

  cameraUtil = new Camera(videoEl, {
    onFrame: async () => { await handsInstance.send({image: videoEl}); },
    width: 480,
    height: 360
  });
  await cameraUtil.start();
}

/* ============================================================
   SHOOTING
   ============================================================ */
function fireShot(){
  crosshairEl.classList.add('fire');
  setTimeout(()=>crosshairEl.classList.remove('fire'), 120);

  const ndcX = (aimX * 2) - 1;
  const ndcY = -((aimY * 2) - 1);
  raycaster.setFromCamera({x:ndcX, y:ndcY}, camera);

  const aliveTargets = targets.filter(t=>t.userData.alive);
  const hits = raycaster.intersectObjects(aliveTargets);
  if(hits.length > 0){
    const hit = hits[0].object;
    hit.userData.alive = false;
    // quick "pop" animation then respawn
    let scale = 1;
    const pop = setInterval(()=>{
      scale += 0.25;
      hit.scale.set(scale,scale,scale);
      hit.material.emissiveIntensity = Math.max(0, hit.material.emissiveIntensity - 0.3);
      if(scale > 2.2){
        clearInterval(pop);
        fragmentsHit++;
        document.getElementById('fragCount').textContent = `${Math.min(fragmentsHit,FRAGMENT_COUNT)}/${FRAGMENT_COUNT}`;
        renderEnigma();
        if(fragmentsHit >= FRAGMENT_COUNT){
          endSequence();
        } else {
          respawnTarget(hit);
        }
      }
    }, 30);
  }
}

/* ============================================================
   RENDER LOOP
   ============================================================ */
function animate(){
  if(!gameActive) return;
  requestAnimationFrame(animate);

  aimX += (targetAimX - aimX) * 0.25;
  aimY += (targetAimY - aimY) * 0.25;

  crosshairEl.style.left = (aimX * window.innerWidth) + 'px';
  crosshairEl.style.top = (aimY * window.innerHeight) + 'px';

  // subtle camera sway for cinematic feel
  const t = performance.now() * 0.0003;
  camera.position.x = Math.sin(t) * 0.15;
  camera.position.y = 1.6 + Math.sin(t*1.7) * 0.05;
  camera.lookAt(new THREE.Vector3(
    (aimX-0.5) * 3,
    1.6 - (aimY-0.5) * 2,
    -10
  ));

  targets.forEach(t=>{ if(t.userData.alive){ t.rotation.y += 0.02 * t.userData.spin; t.rotation.x += 0.01; }});

  renderer.render(scene, camera);
}

/* ============================================================
   ENDING
   ============================================================ */
function endSequence(){
  gameActive = false;
  document.getElementById('revealedPhrase').textContent = ENIGMA_TARGET;
  setTimeout(()=>{
    document.getElementById('gameWrap').classList.remove('show');
    document.getElementById('ending').classList.add('show');
  }, 900);
}

/* ============================================================
   START FLOW
   ============================================================ */
startBtn.addEventListener('click', async ()=>{
  document.getElementById('intro').style.display = 'none';
  document.getElementById('loading').classList.add('show');
  try{
    initThree();
    await initHandTracking();
  }catch(e){
    document.getElementById('loading').innerHTML =
      '<p style="color:#ff2b3d;max-width:320px;text-align:center;font-family:JetBrains Mono,monospace;">'+
      'Não foi possível acessar a câmera. Verifique a permissão e recarregue a página.</p>';
    return;
  }
  document.getElementById('loading').classList.remove('show');
  document.getElementById('gameWrap').classList.add('show');
  gameActive = true;
  animate();
});
</script>
</body>
</html>
